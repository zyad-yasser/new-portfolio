name: portfolio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # Upstash's Redis client speaks REST, not the native Redis protocol - this shim exposes
  # the redis service above over Upstash's REST API so @upstash/redis/ratelimit work
  # locally without a real Upstash account. Point UPSTASH_REDIS_REST_URL/TOKEN at it.
  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:-local_dev_token}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "${SRH_PORT:-8079}:80"
    depends_on:
      - redis

  # One-shot init container: waits for minio, then creates the app's bucket and makes
  # objects in it publicly readable (so uploaded files can be linked to directly). Exits
  # once done - `docker compose up` will show it as "exited (0)", that's expected.
  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-portfolio-uploads};
      mc anonymous set download local/${MINIO_BUCKET:-portfolio-uploads};
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
  redis_data:
